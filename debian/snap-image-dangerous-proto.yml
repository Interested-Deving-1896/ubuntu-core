include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/blocks/snap-base.yml
      - /gitlab-templates/blocks/workflow.yml

snap_image_dangerous:
  extends: .snap_base
  inherit:
    default: true
  before_script:
   
  script:
    - mkdir -m 0700 /home/snaptester/.snap/gnupg/
    - mkdir -m 0700 /home/snaptester/.snap/gnupg/private-keys-v1.d/
    - export GNUPGHOME=/home/snaptester/.snap/gnupg/
    - echo $GNUPGHOME
    - echo $KDE_NEON_CORE_IMAGE_KEY > kde-neon-core-image-key
    - echo $PRIVATE_KEY | base64 --decode | gpg --batch --import
    #- echo -e $PRIVATE_KEY | base64 --decode | gpg --import
    - gpg --import-ownertrust <(echo "$OWNER_TRUST")  
    - gpg --list-keys
    - snapcraft whoami
    - echo building $KDE_SNAP_MODULE_NAME in dangerous mode ...
    - make dangerous
  interruptible: true

  after_script:
    - Invoke-RestMethod -Headers @{ "UBUNTU_CORE_PUBLISH"="$CI_JOB_TOKEN" } -InFile kde-neon-core-dangerous-amd64.tar.gz -uri "${CI_API_V4_URL}/projects/30718/packages/generic/ubuntu_core/kde-neon-core-dangerous-amd64.tar.gz" -Method put -uri "${CI_API_V4_URL}/projects30718/packages/generic/ubuntu_core/kde-neon-core-dangerous-amd64_{$CI_COMMIT_TIMESTAMP}.tar.gz" -Method put
    - rm kde-neon-core-image-key
    - rm -rf /home/snaptester/.snap/gnupg
  